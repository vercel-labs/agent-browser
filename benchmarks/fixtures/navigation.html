<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Late navigation</title>
  </head>
  <body>
    <p id="status">waiting</p>
    <script>
      const delay = Number(
        new URLSearchParams(location.search).get("delay") || 1500,
      );
      setTimeout(() => {
        location.href = "/navigation-target.html";
      }, delay);
    </script>
  </body>
</html>
