<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Late dialog</title>
  </head>
  <body>
    <p id="status">waiting</p>
    <script>
      const delay = Number(
        new URLSearchParams(location.search).get("delay") || 1500,
      );
      setTimeout(() => {
        window.__signalAt = Date.now();
        window.alert("late dialog");
      }, delay);
    </script>
  </body>
</html>
