[package]
name = "agent-browser"
version = "0.38.2"
edition = "2021"
description = "Fast browser automation CLI for AI agents"
license = "Apache-2.0"
repository = "https://github.com/vercel-labs/agent-browser"
homepage = "https://agent-browser.dev"
readme = "../README.md"
keywords = ["browser", "automation", "ai", "cdp", "chrome"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
base64 = "0.22"
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false }
# PEM decoding for --ca-cert. Used instead of rustls-pemfile (unmaintained,
# RUSTSEC-2025-0134): rustls already depends on rustls-pki-types, and its
# `PemObject::pem_reader_iter` covers the same preamble-skipping PEM parse.
rustls-pki-types = { version = "1", features = ["std"] }
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
# Only the codecs agent-browser actually decodes/encodes: PNG and JPEG
# screenshots, plus WebP for CDP frames that arrive in that format. Disabling
# default features drops avif (ravif -> rav1e -> libfuzzer-sys, NCSA-licensed)
# and exr (pulp -> paste, unmaintained, RUSTSEC-2024-0436) from the tree.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
sha2 = "0.10"
aes-gcm = "0.10"
async-trait = "0.1"
socket2 = "0.6"
similar = "2"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
urlencoding = "2"
rust-embed = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

# Keep image processing real-time while application code remains debuggable.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3
