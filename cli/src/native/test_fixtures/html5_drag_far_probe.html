<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HTML5 Drag Far Probe</title>
  <style>
    body {
      margin: 16px;
      font: 14px/1.4 sans-serif;
    }

    .box {
      width: 120px;
      height: 60px;
      color: white;
    }

    #src { background: #0070f3; }
    #far { background: #0f9d58; }

    #gap {
      height: 3000px;
      margin: 16px 0;
      border: 1px dashed #aaa;
    }
  </style>
</head>
<body>
  <div class="box" id="src" draggable="true">source</div>
  <div id="gap">3000px of page between source and far target</div>
  <div class="box" id="far">far target</div>
  <script>
    window.__html5DragFarProbe = { events: [] };
    const far = document.getElementById("far");

    for (const type of ["mousedown", "dragstart", "drop", "dragend"]) {
      document.addEventListener(type, (event) => {
        const target = event.target.id || event.target.tagName;
        window.__html5DragFarProbe.events.push(`${type} on ${target}`);
      }, true);
    }

    far.addEventListener("dragover", (event) => event.preventDefault());
    far.addEventListener("drop", (event) => event.preventDefault());
  </script>
</body>
</html>
