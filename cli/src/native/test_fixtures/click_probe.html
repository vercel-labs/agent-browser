<!doctype html>
<html>
<head><meta charset="utf-8"><title>click probe</title></head>
<body>
<button id="target" style="width:200px;height:80px">Target</button>
<script>
  window.__log = [];
  for (const type of ["mousedown", "mouseup", "click", "auxclick", "dblclick", "contextmenu"]) {
    document.addEventListener(type, (e) => {
      window.__log.push(
        `${e.type}:b${e.button}:d${e.detail}:c${+e.ctrlKey}s${+e.shiftKey}a${+e.altKey}m${+e.metaKey}`
      );
      if (type === "contextmenu") e.preventDefault();
    }, true);
  }
</script>
</body>
</html>
