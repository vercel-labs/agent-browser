<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Upload deployment - Acme</title>
<style>
body { font: 14px/1.5 system-ui; max-width: 560px; margin: 3rem auto; padding: 1rem; }
label, input, select, textarea, progress { display: block; margin-bottom: 1rem; }
fieldset { border: 0; padding: 0; }
fieldset:disabled { opacity: .5; }
[role="alert"] { color: #d33; }
[hidden] { display: none !important; }
</style>
<h1>Upload deployment</h1>
<p>Package your build output and ship it to an environment.</p>
<div id="progress-panel" hidden>
  <ol aria-label="Deployment stages"><li data-stage>Validating package</li><li data-stage>Uploading <span id="pct"></span></li><li data-stage>Building</li></ol>
  <progress id="bar-fill" aria-label="Upload progress" max="100" value="0"></progress>
  <p id="stage-text" role="status" aria-live="polite"></p>
</div>
<div id="upload-complete" role="status" aria-live="polite" hidden>
  <h2>Upload complete</h2><p>Deployment ready</p>
  <p id="deploy-url">acme-dashboard-7k2f.vercel.app</p>
  <button type="button" id="again">Deploy another</button>
</div>
<form id="deploy-form" novalidate>
  <fieldset id="fields">
    <label for="project">Project name (required)</label><input id="project" name="project" required autocomplete="off" aria-describedby="project-error">
    <p id="project-error" role="alert"></p>
    <label for="environment">Environment</label><select id="environment" name="environment"><option value="production">Production</option><option value="preview">Preview</option><option value="development">Development</option></select>
    <label for="notes">Release notes</label><textarea id="notes" name="notes"></textarea>
    <label for="package">Deployment package</label><input id="package" name="package" type="file" aria-describedby="package-error">
    <p id="file-name" aria-live="polite"></p><p id="package-error" role="alert"></p>
    <button id="deploy">Deploy</button>
  </fieldset>
</form>
<script>
const form = document.getElementById("deploy-form"), fields = document.getElementById("fields");
const project = document.getElementById("project"), fileInput = document.getElementById("package");
const fileName = document.getElementById("file-name"), projectError = document.getElementById("project-error"), packageError = document.getElementById("package-error");
const panel = document.getElementById("progress-panel"), complete = document.getElementById("upload-complete"), progress = document.getElementById("bar-fill");
const stageText = document.getElementById("stage-text"), pct = document.getElementById("pct"), stages = panel.querySelectorAll("[data-stage]");
const labels = ["Validating package", "Uploading", "Building"];
let speed = parseFloat(new URLSearchParams(location.search).get("speed")), timer = null;
if (!(speed > 0)) speed = 1;
fileInput.onchange = () => {
  const file = fileInput.files[0];
  const size = file && (file.size < 1024 ? file.size + " B" : file.size < 1048576 ? (file.size / 1024).toFixed(1) + " KB" : (file.size / 1048576).toFixed(1) + " MB");
  fileName.textContent = file ? file.name + " (" + size + ")" : "";
  if (file) packageError.textContent = "";
};
project.oninput = () => { if (project.value.trim()) { projectError.textContent = ""; project.removeAttribute("aria-invalid"); } };
form.onsubmit = event => {
  event.preventDefault();
  if (timer) return;
  projectError.textContent = project.value.trim() ? "" : "Project name is required.";
  packageError.textContent = fileInput.files.length ? "" : "Choose a deployment package to upload.";
  project.removeAttribute("aria-invalid");
  if (projectError.textContent) project.setAttribute("aria-invalid", "true");
  if (projectError.textContent || packageError.textContent) { (projectError.textContent ? project : fileInput).focus(); return; }
  document.getElementById("deploy-url").textContent = (project.value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "project") + "-7k2f.vercel.app";
  fields.disabled = true; panel.hidden = false; panel.scrollIntoView({ block: "center" });
  const start = performance.now();
  const update = () => {
    const elapsed = (performance.now() - start) * speed;
    const stage = elapsed < 2000 ? 0 : elapsed < 10000 ? 1 : elapsed < 14000 ? 2 : 3;
    stages.forEach((item, index) => item.dataset.state = index < stage ? "done" : index === stage ? "active" : "pending");
    progress.value = stage === 0 ? 0 : stage === 1 ? Math.round((elapsed - 2000) / 80) : 100;
    pct.textContent = progress.value > 0 ? progress.value + "%" : "";
    stageText.textContent = stage < 3 ? labels[stage] + "..." : "";
    if (stage === 3) { clearInterval(timer); timer = null; panel.hidden = true; complete.hidden = false; complete.scrollIntoView({ block: "center" }); }
  };
  timer = setInterval(update, 100); update();
};
document.getElementById("again").onclick = () => {
  clearInterval(timer); timer = null; form.reset(); fileName.textContent = projectError.textContent = packageError.textContent = stageText.textContent = pct.textContent = "";
  project.removeAttribute("aria-invalid"); complete.hidden = panel.hidden = true; progress.value = 0;
  stages.forEach(item => item.dataset.state = "pending"); fields.disabled = false; project.focus();
};
</script>
</html>
