packages:
  - '.'
  - 'packages/*'
  - 'packages/@agent-browser/*'
  - 'docs'
  - 'tests'
minimumReleaseAge: 2880
# First-party packages are exempt so @agent-browser/eve can depend on a
# just-released @agent-browser/sandbox without waiting out the release age.
# tsc-ts and its platform packages are Vercel Labs packages too.
minimumReleaseAgeExclude:
  - '@agent-browser/sandbox'
  - eve
  - tsc-ts
  - '@tsc-ts/*'
allowBuilds:
  esbuild: false
  '@mongodb-js/zstd': false
  msw: false
  node-liblzma: false
  sharp: false
  unrs-resolver: false
patchedDependencies:
  next@16.3.4: patches/next@16.3.4.patch
